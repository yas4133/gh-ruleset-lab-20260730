name: GH App environment secret integrity canary

on:
  workflow_dispatch:
    inputs:
      expected_kind:
        description: Owner or UAT canary value
        required: true
        type: choice
        options:
          - owner
          - uat
      marker:
        description: Canonical issue title
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  consume-environment-secret:
    runs-on: ubuntu-latest
    environment: gh-r23-secret-env
    env:
      SECRET_VALUE: ${{ secrets.GH_R23_ENV_AUTHZ_SECRET }}
      EXPECTED_KIND: ${{ inputs.expected_kind }}
      MARKER: ${{ inputs.marker }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create issue only when selected canary matches environment secret
        run: |
          match=false
          if [[ "$EXPECTED_KIND" == "owner" && "$SECRET_VALUE" == "GH-R23-ENV-OWNER-VALUE-72C9E4A1" ]]; then
            match=true
          fi
          if [[ "$EXPECTED_KIND" == "uat" && "$SECRET_VALUE" == "GH-R23-ENV-UAT-VALUE-B31D8F65" ]]; then
            match=true
          fi
          if [[ "$match" == "true" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues" -f title="${MARKER}" -f body="Created after canonical environment-secret match."
          fi
