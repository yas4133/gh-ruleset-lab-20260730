name: GH App Authz Canary

on:
  workflow_dispatch:
    inputs:
      marker:
        description: Owned authorization canary
        required: true
        type: string
  repository_dispatch:
    types:
      - gh_app_authz_canary

permissions:
  contents: read
  issues: write

jobs:
  prove-authority:
    runs-on: ubuntu-latest
    env:
      MARKER: ${{ inputs.marker || github.event.client_payload.marker }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create canonical canary issue
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues" \
            -f "title=${MARKER}" \
            -f "body=Owned Actions authority canary."
