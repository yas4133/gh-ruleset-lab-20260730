name: GH App secret integrity canary

on:
  workflow_dispatch:
    inputs:
      expected_kind:
        description: Owner or UAT canary value
        required: true
        type: choice
        options:
          - owner
          - uat
      marker:
        description: Canonical issue title
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  consume-secret:
    runs-on: ubuntu-latest
    env:
      SECRET_VALUE: ${{ secrets.GH_R21_AUTHZ_SECRET }}
      EXPECTED_KIND: ${{ inputs.expected_kind }}
      MARKER: ${{ inputs.marker }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create issue only when selected canary matches stored secret
        run: |
          match=false
          if [[ "$EXPECTED_KIND" == "owner" && "$SECRET_VALUE" == "GH-R21-OWNER-VALUE-19A6DCE3" ]]; then
            match=true
          fi
          if [[ "$EXPECTED_KIND" == "uat" && "$SECRET_VALUE" == "GH-R21-UAT-VALUE-A88F3C21" ]]; then
            match=true
          fi
          if [[ "$match" == "true" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues" -f title="${MARKER}" -f body="Created after canonical secret-value match."
          fi
