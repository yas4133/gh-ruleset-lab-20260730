name: GH-R57 review-thread consumer

on:
  pull_request_review_thread:
    types: [resolved, unresolved]

permissions:
  contents: read

jobs:
  forbidden-unlisted-event-consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Record omitted event principal
        env:
          EVENT_NAME: ${{ github.event_name }}
          ORIGINAL_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          printf 'event=%s\nactor=%s\ntriggering_actor=%s\n' "$EVENT_NAME" "$ORIGINAL_ACTOR" "$TRIGGERING_ACTOR"
      - name: Build owned secret evidence
        env:
          OWNED_CANARY: ${{ secrets.GH_R57_OWNED_CANARY }}
        run: |
          umask 077
          printf '%s' "$OWNED_CANARY" > canary.txt
      - name: Upload owned secret evidence
        uses: actions/upload-artifact@v4
        with:
          name: gh-r57-forbidden-review-thread-${{ github.run_id }}
          path: canary.txt
          retention-days: 1
