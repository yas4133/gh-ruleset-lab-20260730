name: GH-R25 artifact attestation canary

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Create owned artifact
        run: printf '%s\n' 'GH-R25-OWNER-ATTESTED-ARTIFACT-7C2E91A4' > gh-r25-artifact.txt
      - name: Attest owned artifact
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: gh-r25-artifact.txt
